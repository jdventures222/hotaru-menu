  font: 400 1.0625rem/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--amber); color: var(--amber-ink); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 8px; }
a { color: inherit; text-underline-offset: .2em; text-decoration-color: var(--seam-2); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
[hidden] { display: none !important; }
.vh {
  position: absolute !important; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.wrap {
  max-width: 1120px;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

/* Panel label type: condensed silkscreen caps */
.label {
  font-size: .8125rem;
  font-weight: 650;
  font-stretch: 82%;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text-2);
}

/* LED indicator: the only light on the panel */
.led {
  display: inline-block;
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--ghost);
  box-shadow: inset 0 0 0 1px var(--seam-2);
  transition: background .2s var(--ease), box-shadow .2s var(--ease);
}
.led.on, .is-lit > .led {
  background: var(--amber);
  box-shadow: 0 0 10px 1px var(--amber-glow);
}

/* "to confirm" / "sample": dashed means provisional */
.tbc {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  height: 20px;
  padding: 0 7px;
  border: 1px dashed var(--text-3);
  border-radius: 999px;
  font: 600 .75rem/1 var(--ui);
  font-stretch: 85%;
  letter-spacing: .04em;
  text-transform: none;
  color: var(--text-2);
  white-space: nowrap;
}

/* Draft strip */
.draft {
  background: var(--panel);
  border-bottom: 1px dashed var(--seam-2);
  color: var(--text-2);
  font-size: .9375rem;
}
.draft .wrap { display: flex; align-items: center; gap: .6em; min-height: 44px; padding-block: 8px; }
.draft .ring {
  width: 10px; height: 10px; flex: none;
  border: 1.5px dashed var(--text-2);
  border-radius: 50%;
}

/* Header */
.top { padding-block: 24px 0; }
.top h1 {
  font-size: clamp(1.7rem, 4.6vw + .7rem, 3.1rem);
  font-weight: 760;
  font-stretch: 122%;
  line-height: 1.02;
  letter-spacing: .015em;
  text-transform: uppercase;
}
.top h1 .tbc { margin-left: 10px; vertical-align: .45em; }
.meta { list-style: none; margin: 16px 0 0; padding: 0; max-width: 620px; }
.meta li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  padding-block: 4px;
  border-top: 1px solid var(--seam);
  color: var(--text-2);
}
.meta li:last-child { border-bottom: 1px solid var(--seam); }
.meta .tel { display: inline-flex; align-items: center; min-height: 44px; color: var(--text); }
.status { display: grid; grid-template-columns: 10px minmax(0, 1fr); column-gap: 10px; align-items: baseline; }
.status .led { align-self: start; margin-top: .5em; }
.status > :nth-child(3) { grid-column: 2; }
.status strong { color: var(--text); font-weight: 600; }

/* Sections */
.section { padding-block: 44px 0; }
.section h2 {
  margin-bottom: 16px;
  font-size: 1.375rem;
  font-weight: 800;
  font-stretch: 112%;
  letter-spacing: .03em;
  text-transform: uppercase;
}
.choose { padding-top: 30px; }

/* Time rail: the burner's timer */
.rail-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.clock { display: flex; align-items: baseline; gap: 5px; color: var(--text); }
.clock .seg { font-size: 1.05rem; }
.clock .ap { font-size: .8125rem; font-weight: 700; font-stretch: 85%; }
.rail { position: relative; margin-top: 10px; }
.rail-bar {
  position: relative;
  height: 40px;
  border: 1px solid var(--seam-2);
  border-radius: 10px;
  overflow: hidden;
  background:
    repeating-linear-gradient(135deg, transparent 0 7px, rgb(245 235 223 / .05) 7px 8px),
    var(--panel);
}
.band, .gap {
  position: absolute;
  top: 0; bottom: 0;
  display: flex;
  align-items: center;
  padding-inline: 10px;
  overflow: hidden;
  white-space: nowrap;
  font-size: .8125rem;
  font-weight: 700;
  font-stretch: 85%;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.gap { color: var(--text-2); }
.band { background: var(--key); color: var(--text); border-left: 1px solid var(--seam-2); }
.band.is-lit { background: #352613; color: var(--amber); }
.marker {
  position: absolute;
  top: -5px; bottom: -5px;
  width: 2px;
  margin-left: -1px;
  background: var(--amber);
  border-radius: 2px;
}
.marker::before {
  content: "";
  position: absolute;
  top: -5px; left: -4px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 10px 1px var(--amber-glow);
}
.ticks { position: relative; height: 22px; margin-top: 6px; font-size: .8125rem; color: var(--text-2); }
.ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }

.nowline { display: grid; grid-template-columns: 10px minmax(0, 1fr); column-gap: 10px; margin: 18px 0 0; font-weight: 600; }
.nowline .led { margin-top: .5em; }
.nowline .tbc { margin-left: 6px; }

/* Option keys (phone): a burner's mode buttons */
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.key {
  display: grid;
  gap: 6px;
  align-content: center;
  justify-items: start;
  min-height: 66px;
  padding: 10px 11px;
  border: 1px solid var(--seam-2);
  border-radius: 12px;
  background: var(--key);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .2s var(--ease);
}
.key[aria-current="true"] { border-color: var(--amber); background: #2c2119; }
.kname { font-weight: 700; font-stretch: 92%; line-height: 1.1; }
.kprice { display: flex; align-items: baseline; gap: 2px; color: var(--text); }
.keys.is-now .kprice { color: var(--amber); }
.kprice .tbc { height: 18px; }
.kprice .cur { font-size: .75rem; font-weight: 700; }
.kprice .seg { font-size: .95rem; }

/* Option panels */
.cards {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: min(86%, 360px);
  gap: 12px;
  margin: 12px calc(-1 * var(--gutter)) 0;
  padding: 2px var(--gutter) 4px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scroll-padding-inline: var(--gutter);
  scrollbar-width: none;
}
.cards::-webkit-scrollbar { display: none; }
.card {
  display: flex;
  flex-direction: column;
  scroll-snap-align: start;
  background: var(--panel);
  border: 1px solid var(--seam);
  border-radius: var(--radius);
  overflow: hidden;
}
.art {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 16 / 7;
  background: var(--ground);
  border-bottom: 1px solid var(--seam);
  color: var(--text-3);
}
.art svg { width: 78%; height: 88%; }
.art svg * { vector-effect: non-scaling-stroke; }
.art img { width: 100%; height: 100%; object-fit: cover; }
.art .label { position: absolute; left: 12px; top: 10px; font-size: .75rem; }
.card-body { display: grid; gap: 14px; padding: 16px 16px 18px; }
.card h3 {
  font-size: 1.625rem;
  font-weight: 800;
  font-stretch: 112%;
  line-height: 1.1;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.card h3 .tbc { margin-left: 10px; vertical-align: .3em; }
.about { margin: 0; color: var(--text-2); font-size: .9375rem; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--seam); }
.row {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  min-height: 72px;
  padding-block: 10px;
  border-bottom: 1px solid var(--seam);
}
.when { display: grid; gap: 3px; }
.pname { display: flex; align-items: center; gap: 8px; }
.pname .state { color: var(--amber); }
.is-next .pname .state { color: var(--text); }
.ptime { color: var(--text-2); font-size: .875rem; line-height: 1.35; }
.price { display: grid; justify-items: end; gap: 5px; }
.readout { display: flex; align-items: flex-start; gap: 3px; color: var(--unlit); }
.readout .cur { margin-top: .15em; font-size: .9375rem; font-weight: 700; }
.seg { display: grid; font-family: var(--seg); font-weight: 700; font-size: 1.5rem; line-height: 1; }
.seg > span { grid-area: 1 / 1; text-align: right; }
.seg .ghost { color: var(--ghost); }
.seg .dp { font-family: var(--ui); font-weight: 800; }
.is-lit .readout { color: var(--amber); }
.is-lit .seg { font-size: 2.25rem; }
.is-lit .seg .lit { text-shadow: 0 0 16px var(--amber-glow); animation: power-on .9s var(--ease) both; }
@keyframes power-on { from { color: var(--unlit); text-shadow: none; } }

/* Actions: under the cards on a laptop, under the thumb on a phone */
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.actions > :first-child:nth-last-child(3) { grid-column: 1 / -1; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 52px;
  padding: 0 16px;
  border: 1px solid var(--seam-2);
  border-radius: 12px;
  background: var(--key);
  color: var(--text);
  font-weight: 700;
  font-stretch: 95%;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition: background .2s var(--ease), border-color .2s var(--ease);
}
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
@media (hover: hover) {
  .btn:hover { border-color: var(--text-3); }
  .btn.primary:hover { background: #ffc266; }
  .key:hover { border-color: var(--text-3); }
}
.btn:active, .key:active { transform: translateY(1px); }

/* What's included */
.note { margin: -6px 0 16px; color: var(--text-2); font-size: .9375rem; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.group { padding: 14px 16px 6px; background: var(--panel); border: 1px solid var(--seam); border-radius: var(--radius); }
.group h3 { margin-bottom: 4px; }
.items { list-style: none; margin: 0; padding: 0; }
.items li {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  min-height: 46px;
  padding-block: 8px;
  border-top: 1px solid var(--seam);
}
.items li:first-child { border-top: 0; }
.iname { margin-right: auto; }
.sample .iname { color: var(--text-2); }
.chip {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--seam-2);
  border-radius: 999px;
  font: 700 .75rem/1 var(--ui);
  font-stretch: 85%;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text);
}

/* Side by side */
.table {
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--seam);
  border-radius: var(--radius);
}
.table table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.table col.opt { width: 19%; }
.table th, .table td { padding: 11px 12px; border-top: 1px solid var(--seam); text-align: left; font-weight: 400; vertical-align: middle; }
.table thead th { border-top: 0; }
.table thead th:not(:first-child), .table td { text-align: center; }
.table tbody th { line-height: 1.3; }
.table tbody th .tbc { margin-top: 4px; }
.table .grp th { background: var(--key); padding-block: 8px; }
.table td .led { vertical-align: middle; }
.table td .led.on { box-shadow: none; }
.table td .led:not(.on) { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }

/* Rules: one strip, hairline seams */
.rules {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  margin: 0;
  background: var(--seam);
  border: 1px solid var(--seam);
  border-radius: var(--radius);
  overflow: hidden;
}
.rule { display: grid; gap: 8px; align-content: start; padding: 14px 16px 16px; background: var(--panel); }
.rule:last-child:nth-child(odd) { grid-column: 1 / -1; }
.rule dd { margin: 0; font-weight: 600; }

.end { height: 56px; }

@media (max-width: 359px) {
  .row { grid-template-columns: 10px minmax(0, 1fr); row-gap: 8px; }
  .price { grid-column: 2; justify-items: start; }
  .price .readout { flex-direction: row; }
}
@media (max-width: 879px) {
  .actions {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    margin: 0;
    padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
    background: var(--ground);
    border-top: 1px solid var(--seam);
  }
  body { padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
  .art { aspect-ratio: 16 / 5; }
  body:has(.actions > :nth-child(3)) { padding-bottom: calc(136px + env(safe-area-inset-bottom)); }
}
@media (min-width: 880px) {
  :root { --gutter: 32px; }
  .keys { display: none; }
  .cards {
    grid-auto-flow: row;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin-inline: 0;
    padding-inline: 0;
    overflow: visible;
  }
  .actions { max-width: 560px; }
  .table { max-width: 820px; }
  .rules { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .rule:last-child:nth-child(odd) { grid-column: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
(() => {
  const M = MENU, L = M.lang;
  // Set by tools/snapshot.mjs: render with no clock, so the saved copy reads right with no script
  // (iOS Files and Quick Look show an AirDropped page without running JavaScript).
  const STATIC = window.HOTARU_STATIC === true;
  const tr = (o, vars = {}) => Object.entries(vars).reduce(
    (s, [k, v]) => s.replaceAll(`{${k}}`, v), (o && (o[L] ?? o.en)) ?? "");
  const ui = (k, vars) => tr(M.ui[k], vars);
  const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
  const $ = id => document.getElementById(id);

  const tbc = v => v.confirmed === true ? "" : `<span class="tbc">${esc(ui("toConfirm"))}</span>`;
  const mark = v => v.sample ? `<span class="tbc">${esc(ui("sample"))}</span>` : tbc(v);

  /* ---- time ---- */
  const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const at = s => { const [h, m] = s.split(":").map(Number); return new Date(Date.UTC(2020, 0, 1, h, m)); };
  const hourFmt = (...ts) => new Intl.DateTimeFormat(L, {
    hour: "numeric", minute: ts.every(t => t.endsWith(":00")) ? undefined : "2-digit", timeZone: "UTC" });
  // No-break spaces inside each time; the only line break falls after the range dash.
  const glue = s => s.replace(/ /g, "\u00a0").replace(/\s*–\s*/g, "\u00a0– ");
  const time = t => glue(hourFmt(t).format(at(t)));
  const span = (a, b) => {
    const f = hourFmt(a, b);
    return glue(f.formatRange ? f.formatRange(at(a), at(b)) : `${f.format(at(a))} – ${f.format(at(b))}`);
  };
  const dayName = (d, weekday = "short") =>
    new Intl.DateTimeFormat(L, { weekday, timeZone: "UTC" }).format(new Date(Date.UTC(2023, 0, 1 + d)));
  const WEEK = [1, 2, 3, 4, 5, 6, 0];
  const days = list => {
    if (list.length === 7) return ui("daily");
    const runs = [];
    for (const p of list.map(d => WEEK.indexOf(d)).sort((a, b) => a - b)) {
      const r = runs[runs.length - 1];
      if (r && p === r[1] + 1) r[1] = p; else runs.push([p, p]);
    }
    return runs.map(([a, b]) => a === b ? dayName(WEEK[a]) : `${dayName(WEEK[a])}–${dayName(WEEK[b])}`).join(", ");
  };

  const clockFmt = new Intl.DateTimeFormat("en-US", {
    timeZone: M.timeZone, weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" });
  const clock = () => {
    const now = new Date();
    const p = Object.fromEntries(clockFmt.formatToParts(now).map(x => [x.type, x.value]));
    return { now, day: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday),

  };
  const periodsOn = d => M.periods.filter(p => p.days.includes(d)).sort((a, b) => mins(a.start) - mins(b.start));
  const hoursOn = d => M.hours.find(h => h.days.includes(d));

  // The price that applies now, or else the next one to start.
  function priceState({ day, min }) {
    const now = periodsOn(day).find(p => min >= mins(p.start) && min < mins(p.end));
    if (now) return { period: now, next: false };
    for (let off = 0; off < 8; off++) {
      const d = (day + off) % 7;
      const p = periodsOn(d).find(p => off > 0 || mins(p.start) > min);
      if (p) return { period: p, next: true, off, d };
    }
    return null;
  }
  const dayWord = (off, d) => off === 1 ? ui("tomorrow") : dayName(d, "long");
  function openState({ day, min }) {
    const h = hoursOn(day);
    if (h && min >= mins(h.open) && min < mins(h.close)) return { open: true, text: ui("openNow", { time: time(h.close) }), quoted: h };
    if (h && min < mins(h.open)) return { open: false, text: ui("opensAt", { time: time(h.open) }), quoted: h };
    for (let off = 1; off < 8; off++) {
      const d = (day + off) % 7, n = hoursOn(d);
      if (n) return { open: false, text: ui(h ? "closedToday" : "closedAllDay", { day: dayWord(off, d), time: time(n.open) }), quoted: n };
    }
    return { open: false, text: "", quoted: null };
  }

  /* ---- readouts ---- */
  const money = new Intl.NumberFormat(L, { style: "currency", currency: M.currency });
  function readout(price, cls = "readout") {
    if (price.amount == null && cls === "kprice" && price.confirmed !== true) return `<span class="kprice">${tbc(price)}</span>`;
    if (price.amount == null) {
      return `<span class="${cls}"><span class="seg" aria-hidden="true"><span class="ghost">88<span class="dp">.</span>88</span><span class="lit">--<span class="dp">.</span>--</span></span></span>`;
    }
    const parts = money.formatToParts(price.amount);
    const cur = parts.filter(p => p.type === "currency").map(p => p.value).join("");
    const num = parts.filter(p => ["integer", "group", "decimal", "fraction"].includes(p.type));
    const digits = map => num.map(p => p.type === "decimal" ? `<span class="dp">${esc(p.value)}</span>` : esc(map(p.value))).join("");
    return `<span class="${cls}"><span class="vh">${esc(money.format(price.amount))}</span>` +
      `<span class="cur" aria-hidden="true">${esc(cur)}</span>` +
      `<span class="seg" aria-hidden="true"><span class="ghost">${digits(v => v.replace(/\d/g, "8"))}</span><span class="lit">${digits(v => v)}</span></span></span>`;
  }

  /* ---- drawings for empty photo slots ---- */
  const amber = 'fill="var(--amber)" stroke="none"';
  const POT = `<path d="M80 36c-5-6 5-10 0-16s5-10 0-16"/><path d="M100 32c-5-6 5-10 0-16s5-10 0-16" opacity=".6"/><path d="M120 36c-5-6 5-10 0-16s5-10 0-16"/>` +
    `<path d="M52 46h96"/><path d="M56 46v4c0 13 14 22 30 22h28c16 0 30-9 30-22v-4"/><path d="M44 48h8M148 48h8"/><path d="M66 54h68" opacity=".5"/>` +
    `<rect x="40" y="78" width="120" height="14" rx="3"/><circle cx="146" cy="85" r="2.6" ${amber}/>`;
  const GRILL = `<circle cx="78" cy="24" r="2" ${amber}/><circle cx="112" cy="12" r="1.6" ${amber}/><circle cx="128" cy="30" r="2.2" ${amber}/><circle cx="94" cy="6" r="1.3" ${amber} opacity=".7"/>` +
    `<ellipse cx="100" cy="54" rx="58" ry="14"/><path d="M50 54h100M58 47h84M58 61h84" opacity=".6"/>` +
    `<path d="M62 67l5 15h66l5-15"/><rect x="40" y="82" width="120" height="10" rx="3"/>`;
  const svg = inner => `<svg viewBox="0 0 200 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const ART = {
    pot: () => svg(POT),
    grill: () => svg(GRILL),
    both: () => svg(`<g transform="translate(-2 24) scale(.56)">${POT}</g><g transform="translate(88 24) scale(.56)">${GRILL}</g>`),
  };
  const ICON = {
    directions: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    call: '<path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    waitlist: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  };
  const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

  /* ---- static render ---- */
  function render() {
    const R = M.restaurant;
    document.documentElement.lang = L;
    document.title = ui("pageTitle", { name: tr(R.name) });

    // Every owner fact the page shows; the banner stays until each one is confirmed.
    const facts = [R.name, R.address, R.phone, ...M.hours, ...M.periods, ...M.options,
      ...M.options.flatMap(o => Object.values(o.prices)), ...M.groups.flatMap(g => g.items), ...M.rules];
    const draft = !facts.every(v => v.confirmed === true);
    $("draft").hidden = !draft && !M.preview;
    $("draft-text").textContent = [M.preview && tr(M.preview), draft && ui("draft")].filter(Boolean).join(" · ");

    $("top").innerHTML =
      `<h1>${esc(tr(R.name))}${tbc(R.name)}</h1><ul class="meta">` +
      `<li><span>${esc(R.address.line1)}, ${esc(R.address.line2)}</span>${tbc(R.address)}</li>` +
      `<li><a class="tel" href="tel:${esc(R.phone.tel)}">${esc(R.phone.display)}</a>${tbc(R.phone)}</li>` +
      `<li id="status"></li></ul>`;

    $("choose-h").textContent = ui("pickOne");
    $("included-h").textContent = ui("included");
    $("compare-h").textContent = ui("compare");
    $("rules-h").textContent = ui("rules");

    $("keys").setAttribute("aria-label", ui("options"));
    $("keys").innerHTML = M.options.map(o =>
      (STATIC ? `<a class="key" href="#card-${esc(o.id)}">`
        : `<button class="key" type="button" data-card="card-${esc(o.id)}" aria-controls="card-${esc(o.id)}">`) +
      `<span class="kname">${esc(tr(o.short))}</span>` +
      M.periods.map(p => o.prices[p.id]
        ? `<span data-period="${esc(p.id)}" hidden>${readout(o.prices[p.id], "kprice")}</span>` : "").join("") +
      (STATIC ? `</a>` : `</button>`)).join("");

    $("cards").innerHTML = M.options.map(o =>
      `<article class="card" id="card-${esc(o.id)}" aria-labelledby="name-${esc(o.id)}">` +
      (o.photo
        ? `<div class="art"><img src="${esc(o.photo)}" alt="${esc(tr(o.name))}"></div>`
        : `<div class="art">${ART[o.art] ? ART[o.art]() : ""}<span class="label">${esc(ui("photoComing"))}</span></div>`) +
      `<div class="card-body"><h3 id="name-${esc(o.id)}">${esc(tr(o.name))}${tbc(o)}</h3>` +
      `<ul class="rows">` + M.periods.filter(p => o.prices[p.id]).map(p =>
        `<li class="row" data-period="${esc(p.id)}"><span class="led" aria-hidden="true"></span>` +
        `<span class="when"><span class="pname label">${esc(tr(p.name))}<span class="state"></span></span>` +
        `<span class="ptime">${esc(days(p.days))} · ${esc(span(p.start, p.end))}</span></span>` +
        `<span class="price">${readout(o.prices[p.id])}${tbc({ confirmed: p.confirmed === true && o.prices[p.id].confirmed === true })}</span></li>`).join("") +
      `</ul><p class="about">${esc(tr(o.about))}</p></div></article>`).join("");

    const W = R.waitlist.url;
    $("actions").innerHTML =
      (W ? `<a class="btn primary" href="${esc(W)}">${icon("waitlist")}${esc(ui("waitlist"))}</a>` : "") +
      `<a class="btn${W ? "" : " primary"}" href="https://www.google.com/maps/search/?api=1&amp;query=${
        esc(encodeURIComponent(`${tr(R.name)}, ${R.address.line1}, ${R.address.line2}`))}">${icon("directions")}${esc(ui("directions"))}</a>` +
      `<a class="btn" href="tel:${esc(R.phone.tel)}">${icon("call")}${esc(ui("call"))}</a>`;

    // Items only some options include carry the base option's name.
    const chips = it => {
      if (M.options.every(o => it.in.includes(o.id))) return "";
      const has = M.options.filter(o => it.in.includes(o.id));
      const bases = has.filter(o => !o.combines);
      return (bases.length ? bases : has).map(o =>
        `<span class="chip"><span class="vh">${esc(ui("onlyWith"))} </span>${esc(tr(o.short))}</span>`).join("");
    };
    $("sample-note").hidden = !M.groups.some(g => g.items.some(it => it.sample));
    $("sample-note").textContent = ui("sampleNote");
    $("groups").innerHTML = M.groups.map(g =>
      `<section class="group" aria-labelledby="g-${esc(g.id)}"><h3 class="label" id="g-${esc(g.id)}">${esc(tr(g.name))}</h3><ul class="items">` +
      g.items.map(it => `<li${it.sample ? ' class="sample"' : ""}><span class="iname">${esc(tr(it.name))}</span>${chips(it)}${mark(it)}</li>`).join("") +
      `</ul></section>`).join("");

    const cell = yes => `<td><span class="led${yes ? " on" : ""}" aria-hidden="true"></span><span class="vh">${esc(ui(yes ? "yes" : "no"))}</span></td>`;
    $("compare").innerHTML =
      `<table><caption class="vh">${esc(ui("compare"))}</caption><colgroup><col>${M.options.map(() => '<col class="opt">').join("")}</colgroup>` +
      `<thead><tr><th scope="col" class="label">${esc(ui("item"))}</th>${M.options.map(o => `<th scope="col" class="label">${esc(tr(o.short))}</th>`).join("")}</tr></thead>` +
      M.groups.map(g => `<tbody><tr class="grp"><th scope="colgroup" colspan="${M.options.length + 1}" class="label">${esc(tr(g.name))}</th></tr>` +
        g.items.map(it => `<tr><th scope="row">${esc(tr(it.name))} ${mark(it)}</th>${M.options.map(o => cell(it.in.includes(o.id))).join("")}</tr>`).join("") +
        `</tbody>`).join("") + `</table>`;

    $("rules").innerHTML = M.rules.map(r =>
      `<div class="rule"><dt class="label">${esc(tr(r.name))}</dt><dd>${r.value ? esc(tr(r.value)) + " " : ""}${tbc(r)}</dd></div>`).join("");
  }

  /* ---- live state: what is lit right now ---- */
  function tick() {
    const c = clock(), s = priceState(c), o = openState(c), h = hoursOn(c.day);

    $("status").innerHTML = `<span class="status"><span class="led${o.open ? " on" : ""}" aria-hidden="true"></span>` +
      `<strong>${esc(o.text)}</strong>${h ? `<span>${esc(ui("today"))} ${esc(span(h.open, h.close))}</span>` : ""}</span>` +
      tbc({ confirmed: [h, o.quoted].every(x => !x || x.confirmed === true) });

    // Rail spans the widest opening hours in the week; today's periods sit on it.
    const start = Math.min(...M.hours.map(x => mins(x.open))), end = Math.max(...M.hours.map(x => mins(x.close)));
    const pct = m => ((m - start) / (end - start)) * 100;
    const today = periodsOn(c.day).filter(p => h && mins(p.start) >= mins(h.open) && mins(p.end) <= mins(h.close));
    const stops = [...new Set([start, ...today.flatMap(p => [mins(p.start), mins(p.end)]), end])].sort((a, b) => a - b);
    const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
    const tparts = new Intl.DateTimeFormat(L, { timeZone: M.timeZone, hour: "numeric", minute: "2-digit" }).formatToParts(c.now);
    const digits = tparts.filter(p => ["hour", "minute", "literal"].includes(p.type) && !/\s/.test(p.value)).map(p => p.value).join("");
    const ap = tparts.filter(p => p.type === "dayPeriod").map(p => p.value).join("");
    const gapStart = h ? mins(h.open) : end;
    $("rail").innerHTML =
      `<div class="rail-head"><span class="label">${esc(ui("today"))} · ${esc(dayName(c.day, "long"))}</span>` +
      `<span class="clock"><span class="vh">${esc(digits + " " + ap)}</span><span class="seg" aria-hidden="true"><span class="ghost">${esc(digits.replace(/\d/g, "8"))}</span><span class="lit">${esc(digits)}</span></span>` +
      `<span class="ap" aria-hidden="true">${esc(ap)}</span></span></div>` +
      `<div class="rail"><div class="rail-bar">` +
      (gapStart > start ? `<div class="gap" style="left:0;width:${pct(gapStart)}%">${esc(ui("closed"))}</div>` : "") +
      today.map(p => `<div class="band${!s.next && s.period === p ? " is-lit" : ""}" style="left:${pct(mins(p.start))}%;width:${pct(mins(p.end)) - pct(mins(p.start))}%">${esc(tr(p.name))}</div>`).join("") +
      `</div>` + (c.min >= start && c.min <= end ? `<span class="marker" style="left:${pct(c.min)}%" aria-hidden="true"></span>` : "") +
      `</div><div class="ticks" aria-hidden="true">${stops.map(m => `<span style="left:${pct(m)}%">${esc(time(hhmm(m)))}</span>`).join("")}</div>`;

    if (!s) return;
    const name = tr(s.period.name);
    const shown = M.options.map(o => o.prices[s.period.id]).filter(Boolean);
    $("nowline").innerHTML = `<span class="led${s.next ? "" : " on"}" aria-hidden="true"></span><span>${esc(
      !s.next ? ui("nowPrice", { period: name })
      : s.off === 0 ? ui("nextPrice", { period: name, time: time(s.period.start) })
      : ui("nextPriceDay", { period: name, time: time(s.period.start), day: dayWord(s.off, s.d) }))} ` +
      `${tbc({ confirmed: s.period.confirmed === true && shown.every(p => p.confirmed === true) })}</span>`;

    document.querySelectorAll(".row").forEach(r => {
      const mine = r.dataset.period === s.period.id, lit = mine && !s.next;
      if (lit !== r.classList.contains("is-lit")) r.classList.toggle("is-lit", lit);
      r.classList.toggle("is-next", mine && s.next);
      r.querySelector(".state").textContent = mine ? ` · ${ui(s.next ? "next" : "now")}` : "";
    });
    $("keys").classList.toggle("is-now", !s.next);
    document.querySelectorAll(".key [data-period]").forEach(k => { k.hidden = k.dataset.period !== s.period.id; });
  }

  /* ---- snapshot: every day's hours and the prices of the period that runs every day ---- */
  function still() {
    const main = [...M.periods].sort((a, b) => b.days.length - a.days.length)[0];
    const shown = M.options.map(o => o.prices[main.id]).filter(Boolean);
    $("status").innerHTML = `<span class="status"><span class="led" aria-hidden="true"></span><span>` +
      M.hours.map(h => esc(`${days(h.days)} ${span(h.open, h.close)}`)).join("<br>") +
      `</span></span>${tbc({ confirmed: M.hours.every(h => h.confirmed === true) })}`;
    $("rail").hidden = true;
    $("nowline").innerHTML = `<span class="led" aria-hidden="true"></span><span>${esc(ui("mainPrice", { period: tr(main.name) }))} ` +
      `${tbc({ confirmed: main.confirmed === true && shown.every(p => p.confirmed === true) })}</span>`;
    document.querySelectorAll(".key [data-period]").forEach(k => { k.hidden = k.dataset.period !== main.id; });
  }

  /* ---- keys follow the swipe; a tap swipes to its card ---- */
  function wireKeys() {
    const track = $("cards"), keys = [...document.querySelectorAll(".key")];
    const setKey = id => keys.forEach(k => k.setAttribute("aria-current", String(k.dataset.card === id)));
    setKey(keys[0] && keys[0].dataset.card);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    keys.forEach(k => k.addEventListener("click", () => {
      const card = $(k.dataset.card);
      track.scrollTo({ left: card.offsetLeft - track.offsetLeft - parseFloat(getComputedStyle(track).scrollPaddingLeft || 0),
                       behavior: reduce ? "auto" : "smooth" });
      setKey(k.dataset.card);
    }));
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.intersectionRatio >= 0.6) setKey(e.target.id); }),
      { root: track, threshold: 0.6 });
    track.querySelectorAll(".card").forEach(c => io.observe(c));
  }

  render();
  if (STATIC) return still();
  tick();
  wireKeys();
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
